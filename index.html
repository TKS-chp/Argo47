<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>TKS | Web Design & Development</title>
  <meta name="description" content="デザインの透明性とプログラムによる堅牢な動作を両立。Webサイト制作、独自Webアプリ、業務自動化スクリプトの開発までワンストップで提供します。">
  <!-- サチコのタグ（組み込み済み） -->
  <meta name="google-site-verification" content="bM9akHj-lS8HRTlVCFUzY7iqJf1Bjtkt7MliwHZps-Q" />

  <style>
    /* テーマ変数 */
    :root {
      --bg-color: #fbfbfb; --text-main: #111317; --text-sub: #666666;
      --border-color: #e5e5e5; --btn-bg: #111317; --btn-text: #ffffff;
      --card-bg: #ffffff; --hover-bg: #f5f5f5; --input-bg: #ffffff;
    }
    [data-theme="dark"] {
      --bg-color: #0a0a0c; --text-main: #f5f5f7; --text-sub: #86868b;
      --border-color: #262629; --btn-bg: #f5f5f7; --btn-text: #0a0a0c;
      --card-bg: #111113; --hover-bg: #1a1a1d; --input-bg: #0a0a0c;
    }

    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      line-height: 1.6; transition: background-color 0.4s ease, color 0.4s ease;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; display: block; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 5%; }

    .fade-in {
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* ヘッダーとメニュー */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 30px 0; border-bottom: 1px solid var(--border-color); position: relative; z-index: 100;
    }
    .logo { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; position: relative; z-index: 101; }
    .global-nav { display: flex; gap: 40px; font-weight: 600; font-size: 0.85rem; letter-spacing: 1px; }
    .global-nav a { transition: color 0.3s ease; }
    .global-nav a:hover { color: var(--text-sub); }
    .header-controls { display: flex; align-items: center; gap: 20px; z-index: 101; }
    .theme-switch {
      background: none; border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;
    }
    .theme-switch:hover { background-color: var(--text-main); color: var(--bg-color); transform: translateY(-2px); }
    
    .hamburger {
      display: none; background: none; border: none; cursor: pointer;
      width: 24px; height: 16px; position: relative; z-index: 101;
    }
    .hamburger span {
      position: absolute; width: 100%; height: 2px; background-color: var(--text-main);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); left: 0;
    }
    .hamburger span:nth-child(1) { top: 0; }
    .hamburger span:nth-child(2) { top: 7px; }
    .hamburger span:nth-child(3) { bottom: 0; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .global-nav {
        position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
        background-color: var(--bg-color); flex-direction: column; justify-content: center; align-items: center;
        transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; gap: 40px; font-size: 1.5rem;
      }
      .global-nav.open { right: 0; }
      .theme-switch span { display: none; }
      .theme-switch { padding: 8px; border-radius: 50%; }
    }

    /* 各セクション */
    .hero { padding: 140px 0 120px; border-bottom: 1px solid var(--border-color); }
    .hero h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 30px; }
    .hero p { font-size: 1.1rem; color: var(--text-sub); max-width: 600px; line-height: 1.8; }

    section { padding: 100px 0; border-bottom: 1px solid var(--border-color); scroll-margin-top: 50px; }
    .section-header { margin-bottom: 60px; }
    .section-title { font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; color: var(--text-sub); text-transform: uppercase; }
